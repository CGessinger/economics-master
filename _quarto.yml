project:
  type: website
  output-dir: docs

bibliography: bibliography.bib

website:
  title: "Economics Master"
  description: "A compact reference of economic theory and empirical methods from the M.Sc. Economics."
  page-navigation: true
  favicon: images/econ-math-icon.svg
  search:
    location: sidebar
  navbar:
    logo: images/econ-math-icon.svg
    search: false
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/CGessinger
        aria-label: GitHub profile of Christian Gessinger
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/christian-gessinger-bb560a17a/
        aria-label: LinkedIn profile of Christian Gessinger
        target: _blank
  page-footer:
    center: 'Christian Gessinger · [GitHub](https://github.com/CGessinger){target="_blank"} · [LinkedIn](https://www.linkedin.com/in/christian-gessinger-bb560a17a/){target="_blank"}'
  sidebar:
    style: docked
    search: true
    # Built automatically from the folders: each folder's index.qmd is the
    # section page; any new .qmd in a folder is added to its section.
    contents: auto

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    code-fold: false
    code-copy: true
    code-tools: false
    highlight-style: github

execute:
  freeze: auto      # re-run R code only when a page changes
  echo: true
  warning: false
  message: false

lang: en
